# PR 构建检查：复用 android-build.yml，使用随机调试签名，不创建 Release
name: PR 构建检查

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  android-build:
    permissions:
      contents: read
    # 调用 @.github/workflows/android-build.yml 的可复用工作流
    uses: ./.github/workflows/android-build.yml
    with:
      # PR 场景不依赖真实 secrets，使用随机生成的调试密钥库完成构建
      use-debug-signing: true