# PR 构建检查：lint + 构建 debug APK 并上传，替代原 pr-build.yml
name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 生成随机调试密钥库（CI 拿不到真实 secrets，仅用于构建验证）
        run: |
          keytool -genkeypair -v \
            -keystore PublicHub \
            -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci-debug-pass -keypass ci-debug-pass \
            -dname "CN=CI-Build, OU=CI, O=WebDAVPass, C=CN"

      - name: Build debug APK
        env:
          KEY_ALIAS: debug
          STORE_PASSWORD: ci-debug-pass
          KEY_PASSWORD: ci-debug-pass
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7