
name: 打包并预发布release

on:
  workflow_dispatch:

jobs:
  # 前置作业：准备环境和获取版本信息
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore into app module
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Get versionName from Gradle (resolved value)
        id: version
        run: |
          # Use the Gradle task added to app/build.gradle.kts to print the computed version name.
          # -q silences extra Gradle output, leaving only the printed version on stdout.
          VERSION=$(./gradlew -q :app:printVersionName)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate version output
        run: |
          # Fail early if version output is empty or doesn't look like a semantic-like version
          if [ -z "${{ steps.version.outputs.version }}" ]; then
            echo "Version output is empty" >&2
            exit 1
          fi
          if ! echo "${{ steps.version.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Version does not match expected pattern (major.minor.patch)" >&2
            exit 1
          fi

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: app/keystore.jks
          retention-days: 1

  # 并行构建作业：构建 debug APK
  build-debug:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download keystore artifact
        uses: actions/download-artifact@v4
        with:
          name: keystore
          path: app

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          KEYSTORE_PATH: keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed universal debug APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-debug-signed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  # 并行构建作业：构建 release APKs
  build-release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download keystore artifact
        uses: actions/download-artifact@v4
        with:
          name: keystore
          path: app

      - name: Build release APKs (split by ABI)
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-apks
          path: app/build/outputs/apk/release/*-release.apk
          retention-days: 1

  # 最终作业：创建 GitHub Pre-release
  release:
    needs: [prepare, build-debug, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: universal-debug-signed-apk
          path: app/build/outputs/apk/debug

      - name: Download release APKs artifact
        uses: actions/download-artifact@v4
        with:
          name: release-signed-apks
          path: app/build/outputs/apk/release

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          prerelease: true
          files: |
            app/build/outputs/apk/release/*-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
