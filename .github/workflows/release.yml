# 发布：仅手动触发。版本号与 tag 由 update.yml（push 到 main 时）维护，
# 本工作流只负责构建 APK、发布预发布 Release 并将上一 CI 预发布转正。
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 解码签名密钥库
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > PublicHub

      - name: 读取版本号
        id: version
        run: |
          set -euo pipefail
          CUR_CODE=$(grep '^versionCode=' version.properties | cut -d= -f2)
          CUR_NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "::notice::发布版本: $CUR_NAME (versionCode $CUR_CODE)"
          echo "version=$CUR_NAME" >> "$GITHUB_OUTPUT"
          echo "versioncode=$CUR_CODE" >> "$GITHUB_OUTPUT"

      - name: 校验 tag 存在（由 update.yml 创建）
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 不存在，请先由 update.yml（push 到 main）创建"
            exit 1
          fi

      - name: Build release APKs（ABI 拆分）
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.versioncode }}"

      - name: Build debug APK（universal，供侧载）
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.versioncode }}"

      - name: 发布 GitHub Release（挂到 update.yml 创建的 tag；上一 CI 预发布转正）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仅将由本工作流（CI）创建的上一条预发布转正，不动其他来源的预发布
          PREV_TAG=$(gh release list --limit 50 --json tagName,isPrerelease,body \
            --jq '[.[] | select(.isPrerelease and ((.body // "") | contains("ci-automatic-release")))] | .[0].tagName // empty')
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "v${{ steps.version.outputs.version }}" ]; then
            PREV_ID=$(gh release view "$PREV_TAG" --json id --jq .id)
            gh api -X PATCH "repos/${{ github.repository }}/releases/$PREV_ID" \
              -F prerelease=false -F make_latest=true > /dev/null
            echo "::notice::已将上一次 CI 预发布 $PREV_TAG 转正为正式发布（本次创建新预发布）"
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --prerelease \
            --generate-notes \
            app/build/outputs/apk/release/*-release.apk \
            app/build/outputs/apk/debug/app-debug.apk
          BODY=$(gh release view "v${{ steps.version.outputs.version }}" --json body --jq .body)
          gh release edit "v${{ steps.version.outputs.version }}" --notes "$BODY"$'\n\n<!-- ci-automatic-release -->'