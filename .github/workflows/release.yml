name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（只预览计算出的版本并验证构建，不实际发布）'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 解码签名密钥库
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > PublicHub

      - name: 计算发版版本号
        id: version
        run: |
          set -euo pipefail
          # 基准：上次修改 version.properties 的 commit；不存在时增量为 0
          BASE=$(git log -1 --format=%H -- version.properties 2>/dev/null || true)
          N=0
          if [ -n "$BASE" ]; then
            N=$(git rev-list --count "$BASE..HEAD")
          fi
          CUR_CODE=$(grep '^versionCode=' version.properties | cut -d= -f2)
          CUR_NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          MAJOR=${CUR_NAME%%.*}
          MINOR=$(echo "$CUR_NAME" | cut -d. -f2)
          VERSION="$MAJOR.$((MINOR + N)).$(date +%m%d%H%M)"
          VERSION_CODE=$((CUR_CODE + N))
          echo "::notice::计算出的发版版本: $VERSION (versionCode $VERSION_CODE, 提交增量 $N)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versioncode=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: 校验发版分支（仅允许 main，避免版本号写回错误分支）
        if: ${{ !inputs.dry_run }}
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::发版必须从 main 分支触发，当前为 ${{ github.ref }}"
            exit 1
          fi

      - name: Build release APKs（ABI 拆分）
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.versioncode }}"

      - name: Build debug APK（universal，供侧载）
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug \
            -PversionName="${{ steps.version.outputs.version }}" \
            -PversionCode="${{ steps.version.outputs.versioncode }}"

      - name: 发布 GitHub Release（打 tag + 附 APK，转正上一次 CI 预发布）
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 仅转正由本工作流（CI）创建的预发布，不动其他来源的预发布
          PREV_TAG=$(gh release list --limit 50 --json tagName,isPrerelease,body \
            --jq '[.[] | select(.isPrerelease and ((.body // "") | contains("ci-automatic-release")))] | .[0].tagName // empty')
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "v${{ steps.version.outputs.version }}" ]; then
            PREV_ID=$(gh release view "$PREV_TAG" --json id --jq .id)
            gh api -X PATCH "repos/${{ github.repository }}/releases/$PREV_ID" \
              -F prerelease=false -F make_latest=true > /dev/null
            echo "::notice::已将上一次 CI 预发布 $PREV_TAG 转正为正式发布"
          fi
          # 用 API 创建轻量 tag（指向本次运行 SHA），避免依赖 checkout 持久化凭据
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v${{ steps.version.outputs.version }}" \
            -f sha="$GITHUB_SHA" > /dev/null
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --prerelease \
            --generate-notes \
            app/build/outputs/apk/release/*-release.apk \
            app/build/outputs/apk/debug/app-debug.apk
          BODY=$(gh release view "v${{ steps.version.outputs.version }}" --json body --jq .body)
          gh release edit "v${{ steps.version.outputs.version }}" --notes "$BODY"$'\n\n<!-- ci-automatic-release -->'

      - name: 回写版本号（该提交成为下次递增基准）
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i "s/^versionCode=.*/versionCode=${{ steps.version.outputs.versioncode }}/" version.properties
          sed -i "s/^versionName=.*/versionName=${{ steps.version.outputs.version }}/" version.properties
          SHA=$(gh api repos/${{ github.repository }}/contents/version.properties --jq .sha)
          gh api -X PUT repos/${{ github.repository }}/contents/version.properties \
            -f message="chore: 发版 v${{ steps.version.outputs.version }} 后回写版本号" \
            -f content="$(base64 -w0 version.properties)" \
            -f sha="$SHA" \
            --jq '.commit.sha'

      - name: 版本预览
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run 完成，正式发布将使用 v${{ steps.version.outputs.version }}（versionCode ${{ steps.version.outputs.versioncode }}）"