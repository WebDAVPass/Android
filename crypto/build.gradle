plugins {
    id 'com.android.library'
}

android {
    namespace 'com.kunzisoft.encrypt'
    compileSdkVersion 37
    // 16KB 页面大小适配：NDK r28 起默认按 16KB ELF 对齐编译，
    // 原 r21 只能产出 4KB 对齐的 libaes.so / libargon2.so，在 16KB 设备上无法加载。
    ndkVersion "29.0.14206865"

    defaultConfig {
        // NDK r29 支持的最低 API 级别为 21（原 19 已被 NDK 移除）；
        // 宿主 app 的 minSdk 为 29，此处下调无实际影响。
        minSdkVersion 21
        targetSdkVersion 35
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 显式开启灵活页面大小（NDK r27 起支持、r28 起默认开启），
        // 与 CMake 中的 -Wl,-z,max-page-size=16384 共同保证 LOAD 段 16KB 对齐。
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // Bouncy castle bug https://github.com/bcgit/bc-java/issues/1685
        resources.pickFirsts.add('META-INF/versions/9/OSGI-INF/MANIFEST.MF')
    }
}

dependencies {
    // Crypto
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'

    androidTestImplementation "androidx.test:runner:1.5.2"
    testImplementation "androidx.test:runner:1.5.2"
}
